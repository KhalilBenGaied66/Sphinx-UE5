# Tunisian Darija voice commands for the measurement.
#
# Written by Claude from general knowledge of Tunisian Arabic. It is a draft for
# a Tunisian speaker to correct BEFORE recording: change a wording, add the one
# people actually say, delete what nobody says. score.py and record.py read this
# file and nothing else, so an edit here changes both.
#
# Per command:
#   id        stable name used in file names and reports
#   en        what the game does
# Per wording (one to three per command; record.py rotates through them by take):
#   ar        Arabic script, as a speaker would write it
#   arabizi   Latin spellings people use (3 = ع, 7 = ح, 9 = ق, 5 = خ); the first
#             one is shown to the speaker
#   loan      set when the wording is a borrowed word, with its source
#   sphinx    PocketSphinx dictionary lines for the French acoustic model:
#             "<token> <French phones>". The tokens, in order, are the phrase the
#             French model listens for. Phone set of the model:
#             aa ai an au bb ch dd ee ei eu ff gg gn ii in jj kk ll mm nn oe on oo
#             ou pp rr ss tt un uu uy vv ww yy zz
#             ع ح ه ء have no French phone and are dropped; ق -> kk; خ غ -> rr
#             (the French uvular r is the closest); ج -> jj; ش -> ch; ڨ -> gg.
#
# Some wordings (barka, dour lisar/limin, arja3 alone, hezz hedhi, battel,
# annuli, attaki) come from a second draft written by another Claude session;
# o9ef (stop) and wakhar (back) from the author's own voice in the first live
# test of the plugin.
#
# The list deliberately keeps a few near-collisions a game would meet
# (ija m3aya / ija lehna, 7ell / 7bes) and two one-syllable answers (ih, la),
# because those are where recognisers confuse commands.

schema = 1

[[command]]
id = "forward"
en = "move forward"
  [[command.wording]]
  ar = "قدّام"
  arabizi = ["9oddem", "9odem", "goddem"]
  sphinx = ["9oddem kk oo dd aa mm"]
  [[command.wording]]
  ar = "إمشي لقدّام"
  arabizi = ["emchi l9oddem", "imchi l9odem"]
  sphinx = ["emchi ee mm ch ii", "l9oddem ll kk oo dd aa mm"]

[[command]]
id = "back"
en = "move back"
  [[command.wording]]
  ar = "لتالي"
  arabizi = ["ltali", "lteli"]
  sphinx = ["ltali ll tt aa ll ii"]
  [[command.wording]]
  ar = "ارجع لتالي"
  arabizi = ["arja3 ltali", "orja3 ltali"]
  sphinx = ["arja aa rr jj aa", "ltali ll tt aa ll ii"]
  [[command.wording]]
  ar = "ارجع"
  arabizi = ["arja3", "orja3"]
  sphinx = ["arja aa rr jj aa"]
  # wakhar: also from the first live test
  [[command.wording]]
  ar = "وخّر"
  arabizi = ["wakhar", "wa5ar", "ou5ar"]
  sphinx = ["wakhar ww aa rr aa rr"]

