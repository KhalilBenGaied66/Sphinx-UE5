# Distractors: things a player says that are NOT commands. A recogniser that
# fires a command on these is producing false matches. "silence" means: say
# nothing, the clip records room noise.
[[distractor]]
id = "chat_howareyou"
ar = "شنوّة أحوالك"
arabizi = "chnowa a7walek"

[[distractor]]
id = "chat_weather"
ar = "الجو مزيان اليوم"
arabizi = "ejjaw mezyen lyoum"

[[distractor]]
id = "chat_coffee"
ar = "نحب نشرب قهوة"
arabizi = "n7eb nochrob 9ahwa"

[[distractor]]
id = "chat_keys"
ar = "وين المفاتح"
arabizi = "win el mfete7"

[[distractor]]
id = "chat_dontget"
ar = "ما فهمتش"
arabizi = "ma fhemtech"

[[distractor]]
id = "silence"
ar = "(صمت)"
arabizi = "(say nothing)"
